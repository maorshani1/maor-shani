name: Build Hebrew Clock APK

on:
  push:
    branches:
      - claude/hebrew-clock-toddler-app-JgOve
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x HebrewClockApp/gradlew
        working-directory: ${{ github.workspace }}

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: HebrewClockApp

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: שעון-שלי-debug
          path: HebrewClockApp/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
