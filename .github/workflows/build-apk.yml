name: Build Hebrew Clock APK

on:
  push:
    branches:
      - claude/hebrew-clock-toddler-app-JgOve
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Gradle 8.4
        run: |
          wget -q "https://services.gradle.org/distributions/gradle-8.4-bin.zip" -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Write local.properties with SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > HebrewClockApp/local.properties

      - name: Build debug APK
        run: |
          unset ANDROID_HOME
          gradle assembleDebug --no-daemon
        working-directory: HebrewClockApp

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sheon-sheli-debug
          path: HebrewClockApp/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
